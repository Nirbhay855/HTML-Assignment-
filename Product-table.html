
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Table</title>
</head>
<body>

    <h1>Online Shopping Store</h1>
    <h2>Product List</h2>

    <table border="1">
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Mobile Phone</td>
            <td>15000</td>
            <td>Available</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Laptop</td>
            <td>45000</td>
            <td>Available</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Headphones</td>
            <td>1200</td>
            <td>Out of Stock</td>
        </tr>

        <tr>
            <td>104</td>
            <td>Keyboard</td>
            <td>800</td>
            <td>Available</td>
        </tr>
    </table>

</body>
</html>
